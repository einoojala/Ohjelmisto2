<html>
  <head>
    <meta charset="UTF-8" />
    <title>JavaScript tehtävä</title>
  </head>
  <body>
    <h1>Lajitteluhattu</h1>
    <p id="target"></p>

    <script>
      "use strict";
      const nimi = prompt("Mikä sinun nimesi on?");
      const luku = Math.floor(Math.random() * 4) + 1;

      let tupa;
      if (luku === 1) {
        tupa = "Rohkelikko";
      } else if (luku === 2) {
        tupa = "Luihuinen";
      } else if (luku === 3) {
        tupa = "Puuskupuh";
      } else {
        tupa = "Korpinkynsi";
      }
      document.querySelector("#target").innerHTML =
        nimi + ", sinä olet " + tupa + ".";
    </script>
  </body>
</html>
