<html>
  <head>
    <meta charset="UTF-8" />
    <title>JavaScript tehtävä</title>
  </head>
  <body>
    <h1>Onko karkausvuosi?</h1>
    <p id="target"></p>

    <script>
      "use strict";
      const vuosi = parseInt(prompt("Anna vuosiluku:"));

      if (vuosi % 400 === 0) {
        document.querySelector("#target").innerHTML =
          vuosi + " on karkausvuosi.";
      } else if (vuosi % 100 === 0) {
        document.querySelector("#target").innerHTML =
          vuosi + " ei ole karkausvuosi.";
      } else if (vuosi % 4 === 0) {
        document.querySelector("#target").innerHTML =
          vuosi + " on karkausvuosi.";
      } else {
        document.querySelector("#target").innerHTML =
          vuosi + " ei ole karkausvuosi.";
      }
    </script>
  </body>
</html>
