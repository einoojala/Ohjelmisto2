<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>JavaScript tehtävä</title>
  </head>
  <body>
    <h1>alkuluku</h1>
    <p id="target"></p>

    <script>
      "use strict";

      const luku = Number(prompt("Anna kokonaisluku:"));
      let alkuluku = true;
      if (luku <= 1) {
        alkuluku = false;
      } else {
        for (let i = 2; i < luku; i++) {
          if (luku % i === 0) {
            alkuluku = false;
          }
        }
      }

      if (alkuluku === true) {
        document.querySelector("#target").innerHTML =
          luku + " on alkuluku.";
      } else {
        document.querySelector("#target").innerHTML =
          luku + " ei ole alkuluku.";
      }
    </script>
  </body>
</html>
